services:

  app:
    build: .
    image: celi-express-app
    container_name: celi-express-app
    depends_on:
      mysql:
        condition: service_healthy
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    ports: 
      - 8000:8000
    volumes:
      - .:/app
    environment:
      DATABASE_URL: mysql://root:root@mysql:3306/celi_express
      REDIS_HOST: redis
      REDIS_PORT: 6379

  mysql:
    image: mysql:latest
    container_name: celi-express-database
    depends_on:
      - redis
    environment:
      MYSQL_DATABASE: celi_express
      MYSQL_ROOT_PASSWORD: root
    ports:
      - 3306:3306
    healthcheck:
      test: "/usr/bin/mysql --user=root --password=root --execute \"SHOW DATABASES;\""
      interval: 2s
      timeout: 20s
      retries: 10

  redis:
    image: redis:latest
    container_name: celi-express-redis
    ports:
      - 6379:6379
